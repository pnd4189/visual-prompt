## STEP 4 — SCENE COUNT

```bash
python3 scripts/calc_scene_count.py \\
    --input "<input_path>" \\
    --chapters-json .work/chapters_qa.json \\
    [--images <N>] [--video] [--videos <M>] [--epic] [--faithful]
```

(Thêm `--epic` / `--faithful` vào lệnh nếu các flag tương ứng set ở STEP 0.)
Chỉ thêm `--video` hoặc `--videos <M>` khi `video_enabled = true`.

Parse stdout JSON → lưu `images_n`, `videos_m`, `mode`, `action_density`,
`recommended_mix`. `mode` phải là `grounded`.

Default auto path tạo khoảng 120–150 image prompts và `videos_m = 0`.
Nếu user truyền `--video` thì auto video dùng
`min(images_n, max(20, round(images_n/6)))`; `--videos M` được tôn trọng đúng M
nhưng phải `M <= images_n`, nếu không thì HALT. Không tự suy ra video từ chữ
“YouTube”.

`recommended_mix` chỉ là metadata “source-supported only”, không phải quota. Không
được thêm combat, crowd, location, artifact hay outcome để đủ tỷ lệ.

Print: `Sẽ tạo: <images_n> ảnh + <videos_m> video clip (0 = tắt). (mode: grounded, density: <density>)`

---

## STEP 5 — SCENE PLAN (Pass 1)

Nếu `.work/scene-plan.md` tồn tại VÀ KHÔNG có `--force-redo`:
- Check cache: `expected_plan_key = sha1(qa_hash + bible_hash + images_n + videos_m)`
- Đọc frontmatter `cache_key` từ scene-plan.md (nếu có). Match → skip.
- Mismatch → WARN "scene-plan stale (input/bible/count changed) — regenerating"
  → tiếp tục.

Load `@prompts/scene-planner.md` + execute → write `.work/scene-plan.md`.
Truyền vào context của planner: `images_n`, `videos_m`, `mode`, `action_density`,
`recommended_mix` (từ STEP 4), `epic`, `faithful`. Nếu có `series_name` và file
`~/.gemini/bibles/<series_name>-visual-history.md` tồn tại, load file đó thành
`visual-history` trong context. Planner PHẢI đọc `.work/chapters_qa.json` và ghi
`source_anchor` là một đoạn trích nguyên văn 6–24 từ trong đúng chapter của row.
Planner không được thêm map/đông nhân vật/combat/đấu pháp hay dramatize vượt text.

Compute `plan_hash = sha1(file_bytes(scene-plan.md))[:12]` → ghi vào
`.work/plan.hash`.

Print: `Scene plan: <N> scenes, <M> flagged for video.`

---

## STEP 5.5 — PLAN VARIATION GATE (deterministic backstop)

Chạy sau khi scene-plan ghi xong. Bắt schema sai, source anchor không tồn tại,
nhân vật không xuất hiện trong chapter, scene/chapter/anchor bị đảo thứ tự,
synopsis trùng, và lặp setting/camera/action/palette. Đây là cổng grounding,
không phải quota ép thêm nhân vật hay combat.

```bash
python3 scripts/validate_scene_plan.py \
  --plan .work/scene-plan.md \
  --chapters-json .work/chapters_qa.json
```

Parse stdout JSON `{total, violations, ok}`. Exit 0 = ok; exit 2 hoặc 1 = HALT,
không được proceed.

**Bounded revise loop (tối đa 2 lần):**
- Nếu `ok: true` → proceed STEP 6.
- Nếu có violations VÀ còn lượt retry:
  - Load `@prompts/scene-planner.md` (revise-flagged contract). Chỉ sửa row bị
    flag; giữ nguyên source facts. Với `ungrounded_source_anchor` hoặc
    `ungrounded_character`, đọc lại đúng chapter và thay bằng beat có thật —
    KHÔNG bịa chi tiết để “lấp” lỗi. Với lặp visual dimension, đổi cách dựng
    hình nhưng không đổi setting/action đã được source khóa. Ghi đè scene-plan.md,
    recompute `plan_hash`.
  - Chạy lại validator.
- Sau 2 lượt mà vẫn còn violations → HALT, liệt kê violations và scene IDs.

Print: `Plan gate: <ok | N violations sau <r> revise>`.

---

## STEP 6 — EXPAND SCENES (Pass 2, resume-safe loop)

**PRECONDITION (bắt buộc):** `.work/scene-plan.md` PHẢI tồn tại (từ STEP 5) và đã
qua STEP 5.5. Nếu chưa có → quay lại STEP 5. KHÔNG bắt đầu sinh prompt mà không có
scene-plan. Ngoại lệ: worker submode (`--worker-manifest`) đọc scene-plan từ
`snapshot_dir` read-only theo mục WORKER SUBMODE — không chạy STEP 5/5.5.

**PARENT-ONLY MICRO-BATCH (bắt buộc):**
- Không spawn, không delegate, không parallel. Active model này tự làm toàn bộ.
- Chia scene rows theo thứ tự thành micro-batch tối đa 3 scene liên tiếp.
- Trong mỗi batch, đọc riêng source anchor + đúng chapter của từng row; viết riêng
  từng `.work/scene-NNN.md`. Không dùng một template rồi thay tên/camera.
- Sau mỗi batch, kiểm tra exact files, size > 0, frontmatter, headers, `has_video`,
  `source_anchor` khớp byte/whitespace-normalized với scene-plan, và
  source-grounded facts. Thiếu hoặc lỗi bất kỳ file nào → HALT tại batch đó.
- Khi context/quota/rate-limit không đủ, dừng sau batch hoàn tất và báo scene ID
  tiếp theo; resume lần sau sẽ giữ các artifact hợp lệ.

Nếu `--force-redo`: `rm -f .work/scene-*.md` TRƯỚC khi vào loop.

Nếu có `similarity_feedback_path`, đọc file trước loop. File tách riêng
`image_rewrite_scene_ids`, `video_rewrite_scene_ids`, và `music_rewrite_loop_ids`
do external similarity gate phát hiện. Với ID image/video, bỏ qua cache dù
`cache_key` còn đúng: xóa đúng `scene-<NNN>.md`, đọc lại scene row + chapter tương
ứng, rồi viết lại image (và video khi được flag). Với ID music, bỏ qua cache của
đúng `music-<NNN>.md` và chạy lại builder cho đúng region. Giữ scene-plan, QA,
bible và mọi artifact không bị flag. Không dùng nội dung cũ làm template; mỗi field
bị flag phải được viết lại từ source-supported beat của row. Sau khi rewrite, phải
chạy lại STEP 7.3; chỉ hoàn tất nếu gate không còn violation.

Khi `auto_repair = true`, đây là batch run không tương tác. Không in kế hoạch để xin
xác nhận và không kết thúc sau phần tóm tắt; phải thực hiện ngay từng micro-batch,
ghi artifact, assemble và chạy gate cho tới khi hoàn tất hoặc HALT vì lỗi thật.

For mỗi micro-batch tối đa 3 scene row trong scene-plan (theo thứ tự scene_id
1..N), hoàn tất artifact gate rồi mới sang micro-batch kế:

  scene_path = `.work/scene-<NNN>.md` (NNN = zero-padded scene_id)

  expected_cache_key = sha1(
      qa_hash + bible_hash + plan_hash + style_hash + serialize(scene_row)
  )[:16]

  a. Nếu scene_path tồn tại VÀ KHÔNG `--force-redo` VÀ scene_id không có trong
     `image_rewrite_scene_ids` hoặc `video_rewrite_scene_ids` của
     `similarity_feedback_path`:
     - Đọc frontmatter, lấy `cache_key` và `source_anchor`.
     - Chỉ khi cả hai match `expected_cache_key` và
       `scene_row.source_anchor` → skip ("scene NNN: cached"); GOTO next scene.
     - Thiếu/mismatch một trong hai → WARN "scene NNN stale or ungrounded —
       regenerating"; xóa file, regenerate.

  b. Load relevant chapter text từ chapters_qa.json (chỉ chapter mà scene_row.chapter
     trỏ tới — KHÔNG load full JSON). Đối chiếu `scene_row.source_anchor` theo
     đúng chữ trong chapter trước khi viết; anchor không khớp → HALT.

  c. Load `@prompts/prompt-expander-image.md` +
     `@references/strict-generation-contract.md` + execute (truyền `mode=grounded`)
     → CHÍNH active model write scene_path bằng file-write tool (đường dẫn tuyệt
     đối trên Agy; không qua shell/script) với frontmatter:
     ```
     ---
     scene_id: <NNN>
     cache_key: <expected_cache_key>
     source_anchor: <exact scene_row.source_anchor>
     has_video: <true|false>
     ---
     ## Image Prompt
     ...
     ```

  d. Nếu `video_enabled = true` VÀ scene_row.flag_for_video = ✓:
     Load `@prompts/prompt-expander-video.md` + execute → append
     `## Video Prompt` block vào scene_path.
     (Nếu `video_enabled = false`: skip hoàn toàn, KHÔNG gọi video expander,
     frontmatter giữ `has_video: false`.)

  e. Log: `Scene <NNN>/<N> done (<image_wc>w image[, <video_wc>w video])`

Sau STEP 6, parent chạy artifact gate toàn cục:
```bash
python3 scripts/validate_artifacts.py \
  --check scenes \
  --work-dir "<work_dir>" \
  --scene-plan "<work_dir>/scene-plan.md"
```

