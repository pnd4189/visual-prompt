PHẢI là phong cách hoạt hình/illustration đã chọn — KHÔNG live-action / photoreal
footage / người thật. Gate `scripts/check_content_safety.py` enforce ở STEP 7 (`--fix`)
+ STEP 8 (re-scan). KHÔNG tự tay sửa output `.txt` để né gate; religion = WARN-and-ship.

### ⛔ EXECUTION CONTRACT — KHÔNG ĐƯỢC TỰ CHẾ

TUYỆT ĐỐI KHÔNG:

1. ❌ KHÔNG tự viết script orchestration/generator riêng (split.py,
