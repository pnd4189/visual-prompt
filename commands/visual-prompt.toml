## STEP 1.25 — CROSS-FILE CONTINUITY AUDIT (mandatory before QA)

Mục tiêu: chống lỗi nhảy chương / bỏ sót chương khi xử lý nhiều file liên tiếp.
Ví dụ file hiện tại bắt đầu Chương 11 thì phải kiểm tra Chương 11 có nối tiếp
Chương 10 của file trước không.

Chạy:

```bash
python3 scripts/check_previous_continuity.py "<input_path>" > .work/continuity-context.json
```

Parse stdout JSON.

- Nếu `status = first_chapter` → không cần file trước, proceed STEP 1.5.
- Nếu `status = previous_not_found` → HALT, in rõ:
  `Lỗi continuity: file hiện tại bắt đầu Chương <first>, nhưng không tìm thấy Chương <first-1> trong các file .txt gần đó. Kiểm tra lại thư mục/file trước để tránh nhảy chương hoặc bỏ sót chương.`
- Nếu `status = candidate_found`:
  1. Kiểm tra số chương: `previous_chapter == first_chapter - 1`. Nếu sai → HALT.
  2. Đọc `previous_tail_excerpt` và `current_first_excerpt`.
  3. Tự đánh giá semantic continuity: Chương đầu file hiện tại có tiếp nối hợp lý
     với đoạn cuối chương trước không? Có dấu hiệu nhảy cảnh bất thường, thiếu
     đoạn chuyển, lặp chương, đảo thứ tự, hoặc mất chương không?
  4. Ghi `.work/continuity-check.md`:
     ```
     # Cross-file Continuity Check
     Status: PASS | WARN | FAIL
     Current first: Chương <N> — <current_first_title>
     Previous file: <previous_path>
     Previous last: Chương <N-1> — <previous_title>
     Finding: <1-3 câu tiếng Việt, nêu vì sao liền mạch hoặc vì sao nghi ngờ>
     ```
  5. Nếu `FAIL` → HALT, không chạy QA. Nếu `WARN` → in cảnh báo và hỏi user xác
     nhận trước khi tiếp tục. Nếu `PASS` → proceed STEP 1.5.

QUY TẮC QA: không được dùng bước hiệu đính để "vá" lỗi continuity. QA chỉ sửa chữ
trong từng chương; nếu nguồn nhảy chương/bỏ chương thì phải dừng trước QA.

---

## STEP 1.5 — QA PROOFREAD (resume-safe loop, always runs)

Cổng hiệu đính: sửa ký tự Trung/Anh còn sót, chính tả/ngữ pháp, câu dịch máy
lủng củng, tách câu quá dài. Mức vừa phải — KHÔNG đổi cốt truyện/tên riêng/số.
Đầu ra `chapters_qa.json` là nguồn duy nhất cho mọi bước sau, và `<stem>_qa.txt`
là file đọc TTS.

Nếu `--force-redo`: `rm -f .work/qa-chapter-*.md` TRƯỚC khi vào loop.

Load `.work/chapters.json`. For mỗi chapter row (theo thứ tự id):

  qa_path = `.work/qa-chapter-<NNN>.md` (NNN = zero-padded chapter id)

  expected_cache_key = sha1(input_hash + serialize(chapter_row))[:16]

  a. Nếu qa_path tồn tại VÀ KHÔNG `--force-redo`:
     - Đọc frontmatter `cache_key`. Match expected → skip ("chương NNN: cached");
       GOTO next chapter.
     - Mismatch → WARN "chương NNN stale — regenerating"; xóa file, regenerate.

  b. Load `@prompts/qa-proofread.md` + execute trên chapter_row (truyền
     `input_hash`) → write qa_path với frontmatter `{chapter_id, title, cache_key}`.

  c. Log: `QA chương <NNN>/<K> done`.

Sau loop:

```bash
python3 scripts/assemble_qa.py --input "<input_path>"
```

Parse stdout JSON. Compute `qa_hash = sha1(file_bytes(.work/chapters_qa.json))[:12]`
→ ghi vào `.work/qa.hash`.

Print: `QA hoàn tất: <chapter_count> chương → chapters_qa.json + <stem>_qa.txt`.

(Từ đây mọi bước đọc `.work/chapters_qa.json`, KHÔNG đọc `chapters.json` nữa.)

---

## STEP 2 — CHARACTER BIBLE

Resolve `bible_path`:
- Nếu `--series NAME`: `bible_path = ~/.gemini/bibles/<NAME>.md`
- Else: `bible_path = <input_dir>/character-bible.md`

Nếu `bible_path` đã tồn tại:
- Load `@prompts/bible-augmenter.md` + execute (append-only via
  `scripts/append_bible_row.py`).
Else:
- Load `@prompts/bible-extractor.md` + execute (write fresh bible).

Compute `bible_hash = sha1(file_bytes(bible_path))[:12]` → ghi vào
`.work/bible.hash`.

