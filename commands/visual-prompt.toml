## STEP 9 — DỌN SCENE FILE (bắt buộc, SAU KHI STEP 7.3 + STEP 8 ĐỀU PASS)

Các file `.work/scene-NNN.md` là trung gian: sản phẩm giao cho user là
`<stem>_image_prompts.txt`. Nhưng chúng là ĐƯỜNG DUY NHẤT để sửa một output bị
trùng lặp — xoá khi similarity chưa pass là tự khoá mình vào ngõ cụt. Helper tự
chạy lại `check_prompt_similarity.py` và từ chối nếu còn fail; đừng cố lách.

Sau khi STEP 7.3 (similarity) và STEP 8 pass hết, gộp xong thì xoá chúng:

```bash
python3 scripts/cleanup_work.py --work .work --image "<stem>_image_prompts.txt"
```

Helper tự từ chối (exit 2) nếu output chưa đủ số scene so với `scene-plan.md` —
KHÔNG được xoá tay để lách. Giữ nguyên `scene-plan.md` và
`active-model-authorship.jsonl` (hợp đồng scene + vết kiểm chứng authorship).

Chỉ chạy ở run trực tiếp. Batch (`--auto-repair`) BỎ QUA step này: driver còn
phải chạy tiếp gate riêng của nó trên `.work` sau khi phiên kết thúc.

Print: `Cleanup: <N> scene file đã xoá (output giữ <M> block)`.

