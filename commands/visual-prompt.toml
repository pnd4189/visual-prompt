## LEAN MODE (`--lean`)

Khi `lean = true`, bộ tiêu chuẩn prompt đổi sang **LEAN SPEC** ở cuối
`@prompts/prompt-expander-image.md`: đúng 5 mục `Subject / Setting / Action /
Style / Negative`, thân prompt 60-220 từ. Camera, ánh sáng, bố cục, không khí do
model sinh ảnh tự quyết — KHÔNG viết các mục đó.

Mục đích: prompt ngắn, sinh nhanh, và khác nhau thật giữa các cảnh. `Subject` +
`Style` lặp lại là ĐÚNG (giữ nhân vật + phong cách nhất quán); `Setting` +
`Action` phải khác nhau ở từng cảnh — đó là hai mục gate đo trùng lặp.

Mọi helper nhận biết chế độ PHẢI được gọi kèm `--lean` trong run này:
`assemble_outputs.py`, `validate_artifacts.py`, `check_prompt_similarity.py`,
`check_run_legit.py`. Guard đọc chế độ từ chính dòng lệnh của user và sẽ TỪ CHỐI
lệnh nào dùng sai cờ — không tự thêm/bớt `--lean` để gate dễ qua.

