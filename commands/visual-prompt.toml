## STEP 8 — SELF-AUDIT (bắt buộc, trước khi báo hoàn tất)

Kiểm tra run đã đi ĐÚNG pipeline (chống tự-chế):

```bash
ls .work/scene-plan.md
python3 scripts/validate_artifacts.py --check scenes --work-dir .work --scene-plan .work/scene-plan.md
python3 scripts/validate_scene_plan.py --plan .work/scene-plan.md
```

Xác nhận:
1. `.work/scene-plan.md` tồn tại. Nếu KHÔNG → run SAI (đã bỏ qua scene-planner):
   in cảnh báo `❌ AUDIT FAIL: thiếu scene-plan.md — pipeline đã bị bỏ qua` và CHẠY
   LẠI đúng từ STEP 5. KHÔNG báo hoàn tất.
2. Số file match strict regex `scene-\\d{3}.md` = `images_n`. Không dùng glob thô
   `scene-*.md` vì sẽ bắt nhầm `scene-plan.md`. Nếu = 0 hoặc thiếu IDs → run SAI,
   chạy lại STEP 6 artifact gate.
3. validate_scene_plan: không còn `protagonist_overspotlight` / `too_many_solo` /
   `tag_monotony` (hoặc đã WARN sau 2 revise). Nếu còn → ghi rõ trong summary.
4. File output cuối được sinh bởi `assemble_outputs.py` (STEP 7), KHÔNG phải tự tay
   ghi. Nếu bạn đã tự ghi file → xoá, chạy lại STEP 7.

Print: `Self-audit: <PASS | FAIL: lý do>`.

**Content-safety re-scan (KHÔNG `--fix`):** chạy lại gate trên file cuối để xác
nhận sạch (hoặc chỉ còn WARN religion). Exit 0 → PASS; exit 2 → WARN (KHÔNG fail
run — đưa residual vào danh sách Warnings của POST-RUN SUMMARY).

```bash
python3 scripts/check_content_safety.py \
  --blocklist references/blocklist-content-safety.md \
  --output "<stem>_image_prompts.txt"
# và "<stem>_video_prompts.txt" nếu có video.
```

Print: `Content-safety: <PASS | WARN: <residual>>`.

