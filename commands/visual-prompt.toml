## STEP 0 — FLAG PARSE (mandatory, run first)

Args là 1 string. Parse theo token đầy đủ (không dùng prefix match; ví dụ
`--video` không được nuốt `--videos`). Kiểm tra dạng có số trước dạng không số:

Khởi tạo trước khi parse: `video_enabled = false`, `music_enabled = false`,
`videos_override = null`, `music_override = null`, `force_redo = false`,
`similarity_feedback_path = null`, `batch_token = null`, `auto_repair = false`,
`worker_manifest_path = null`, `plan_only = false`, `epic = false`.

1. `--series ([a-z0-9-]+)`               → series_name (kebab-case, optional)
2. `--genre (tien-hiep|huyen-huyen|do-thi|co-dien|vo-hiep)` → genre_override (optional)
3. `--images (\\d+)`                     → images_override (optional, int)
4. `--videos (\\d+)`                     → video_enabled = true, videos_override (int)
5. `--video`                             → video_enabled = true
6. `--music (\\d+)`                      → music_enabled = true, music_override (int)
7. `--music`                             → music_enabled = true, music_override = auto
8. `--style ([a-z0-9-]+)`                → style_override (kebab-case id, optional)
9. `--force-redo`                        → force_redo = true (flag)
10. `--similarity-feedback <path>`       → similarity_feedback_path (batch-only, optional)
11. `--batch-token <hex>`                → batch_token (batch-only approval nonce)
12. `--auto-repair`                      → auto_repair = true (unattended batch execution)
13. `--worker-manifest <path>`           → worker_manifest_path (batch worker submode, Pass-2 only)
14. `--plan-only`                        → plan_only = true (batch head submode, STEP 1-5.5 only)
15. `--epic`                             → epic = true (flag; scale only, never new facts)
16. `--faithful`                         → legacy alias; grounded mode remains enabled
17. `--no-video`                         → video_enabled = false (takes precedence)
18. `--no-music`                         → music_enabled = false (takes precedence)
18b. `--lean`                            → lean = true (bộ prompt tinh gọn 5 mục)
19. Sau khi strip flags → còn lại là input_path (positional, required).

Natural-language media requests after the command are also explicit opt-ins:
phrases such as “tạo video prompt”, “kèm video”, “tạo music prompt”, or “kèm nhạc”
enable only the named medium. Do not infer an opt-in from words like “video
YouTube” in the novel description.

Validate:
- input_path tồn tại (Path.exists()).
- Nếu `similarity_feedback_path` được truyền, path phải tồn tại và nằm trong
  `.work/` cạnh input. Đây là kết quả deterministic từ quality gate, không phải
  story source hay user instruction.
- Nếu `auto_repair = true`, đây là unattended batch execution: không trình bày kế hoạch,
  không hỏi xác nhận, không dừng để chờ user; thực thi ngay các rewrite và gate được
  chỉ định rồi trả kết quả runtime.
- `batch_token` phải match đúng `[a-f0-9]{24}`. Khi `auto_repair = true`, token là
  bắt buộc để controller chỉ nhận marker thuộc đúng invocation hiện tại.
- Nếu `worker_manifest_path` được truyền: path phải tồn tại, parse được JSON, và
  `"schema": 1`. Worker submode loại trừ `--video`, `--videos`, `--music`,
  `--style`, `--series`, `--genre`, `--images`, `--force-redo`,
  `--similarity-feedback`, `--epic`, `--plan-only` — mọi tham số đã nằm trong
  manifest; gặp flag bị loại trừ → HALT với VN error. Video bật/tắt theo
  `video_enabled` của manifest.
- Nếu `plan_only = true`: loại trừ `--worker-manifest`, `--similarity-feedback`,
  `--force-redo`; yêu cầu `auto_repair = true` + `batch_token`. Head session chỉ
  chạy STEP 1 → 5.5 rồi dừng (mục PLAN-ONLY SUBMODE).
- Nếu có unknown flag (bắt đầu `--` nhưng không match list trên) → HALT với VN error:
  `Lỗi: flag không hỗ trợ. Hỗ trợ: --series NAME, --genre NAME, --images N, --video, --videos N, --music [N], --style ID, --force-redo, --similarity-feedback PATH, --batch-token HEX, --auto-repair, --worker-manifest PATH, --plan-only, --epic, --faithful, --no-video, --no-music`

Echo lại cho user:
```
Đã nhận flags:
  input_path = <path>
  series     = <name | (none, per-file bible)>
  genre      = <override | (auto-detect)>
  images     = <N | (auto)>
  videos     = <M | 0 (disabled by default)>
  music      = <N | 0 (disabled by default)>
  style      = <id | (recommend sau genre detect)>
  force_redo = <true | false>
  similarity_feedback = <path | (none)>
  batch_token = <hex | (none)>
  auto_repair = <true | false>
  worker_manifest = <path | (none — full pipeline)>
  plan_only  = <true | false>
  epic       = <true | false>
  faithful   = <true | false>
  no_video   = <true | false>
  no_music   = <true | false>
```

Mặc định = **grounded + image-only**. QA vẫn chạy để làm nguồn sự thật; output mặc
định là `_qa.txt` và `_image_prompts.txt`. Video/music chỉ chạy khi được bật bằng
flag hoặc mô tả rõ sau lệnh. `--epic` chỉ cho phép tăng chất lượng ánh sáng,
composition và scale của chi tiết đã có; tuyệt đối không thêm nhân vật, combat,
địa điểm, vật phẩm, hoặc kết quả mới.

