## STEP 5.5 — PLAN VARIATION GATE (deterministic backstop)

Chạy sau khi scene-plan ghi xong. Bắt monotony (adjacent-duplicate), synopsis
fragment, VÀ low-diversity (nhân vật chính >70% / solo >35% / 1 tag >35%) để không
lọt im lặng xuống expander.

```bash
python3 scripts/validate_scene_plan.py --plan .work/scene-plan.md
```

Parse stdout JSON `{total, violations, ok}`. Exit 0 = ok, 2 = có violations,
1 = IO error (in lỗi rồi proceed).

**Bounded revise loop (tối đa 2 lần):**
- Nếu `ok: true` → proceed STEP 6.
- Nếu có violations VÀ còn lượt retry:
  - Load `@prompts/scene-planner.md` (revise-flagged contract). Violations có
    `scene_ids` (adjacent_duplicate / fragment_synopsis) → chỉ sửa các row đó.
    Violations plan-wide `scene_ids: []` (protagonist_overspotlight / too_many_solo
    / tag_monotony) → REBALANCE cả plan: thêm cảnh nhân vật khác/đám đông/môi
    trường, giảm cảnh solo, đa dạng tag. Ghi đè scene-plan.md, recompute `plan_hash`.
  - Chạy lại validator.
- Sau 2 lượt mà vẫn còn violations → WARN liệt kê violations còn lại, KHÔNG
  hard-block, proceed STEP 6.

Print: `Plan gate: <ok | N violations sau <r> revise>`.

