```
✅ visual-prompt hoàn tất.

Input:      <input_path>
Genre:      <genre> (confidence <X.XX>)
Style:      <chosen_style> (<category>)
Bible:      <bible_path> (<N chars>)
Scene plan: .work/scene-plan.md (<N> scenes, <M> video)

Output files:
  📝 <input_stem>_qa.txt              — bản hiệu đính, đưa thẳng vào TTS_Local
  📷 <input_stem>_image_prompts.txt   — <image_count> ảnh
  🎬 <input_stem>_video_prompts.txt   — <video_count> video (indices: <list>)
  🎵 <input_stem>_music_prompts.txt   — <music_count> loop nhạc nền (Lyria)

Warnings:
  <list, hoặc "(không có)">

Bước tiếp:
  1. Đưa `<stem>_qa.txt` vào TTS_Local để tạo giọng đọc
     (VieNeu hoặc VietVoice). Xem HUONG-DAN-SU-DUNG.md §TTS.
  2. Mở công cụ tạo ảnh → paste từng block `--- SCENE NNN ---` từ
     file ảnh để generate hình.
  3. Mở Veo3/Seedance → paste từng block từ file video để generate clip.
  4. Mở Lyria 3 → paste từng block `--- LOOP i / N ---` từ
     file nhạc để tạo nhạc nền instrumental. Xem HUONG-DAN-SU-DUNG.md §Lyria.
  5. Xem chi tiết: HUONG-DAN-SU-DUNG.md §6 (Cách paste vào AI tools).
```
"""
