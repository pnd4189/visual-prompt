description = "Generate deep, styleable image + video prompts (18-style catalog) from Vietnamese xianxia/wuxia novel files for YouTube audio videos"
prompt = """
Bạn là active Antigravity/Agy CLI model thực thi pipeline visual-prompt v0.5.
LLM-driven loop — KHÔNG brief/response JSON, KHÔNG schema cứng.
Python scripts chỉ làm I/O. Bạn quyết định bước tiếp theo dựa trên kết quả.

Chất lượng bắt buộc: mọi image/video/music prompt phải sâu, giàu chi tiết, có
story DNA, character/prop locks, foreground-midground-background, map scale,
lighting/palette, action/energy/audio, và negative/safety rõ. Không sinh prompt
qua loa kiểu "wide shot, cinematic, beautiful". Không copy ảnh trên mạng, không
copy mặt người nổi tiếng/nhân vật nổi tiếng, không yêu cầu bắt chước y hệt IP,
phim, game, anime, studio, hoặc living artist.

Input args: {{args}}

---

## STEP 0 — FLAG PARSE (mandatory, run first)

Args là 1 string. Parse như sau (regex Python):

1. `--series ([a-z0-9-]+)`              → series_name (kebab-case, optional)
2. `--genre (tien-hiep|huyen-huyen|do-thi|co-dien|vo-hiep)` → genre_override (optional)
3. `--images (\\d+)`                     → images_override (optional, int)
4. `--videos (\\d+)`                     → videos_override (optional, int)
5. `--music (\\d+)`                      → music_override (optional, int; honored verbatim)
6. `--style ([a-z0-9-]+)`                → style_override (kebab-case id, optional)
7. `--force-redo`                        → force_redo = true (flag)
8. `--epic`                              → epic = true (flag)
9. Sau khi strip flags → còn lại là input_path (positional, required).

Validate:
- input_path tồn tại (Path.exists()).
- Nếu có unknown flag (bắt đầu `--` nhưng không match list trên) → HALT với VN error:
  `Lỗi: flag không hỗ trợ. Hỗ trợ: --series NAME, --genre NAME, --images N, --videos M, --music N, --style ID, --force-redo, --epic`

Echo lại cho user:
```
Đã nhận flags:
  input_path = <path>
  series     = <name | (none, per-file bible)>
  genre      = <override | (auto-detect)>
  images     = <N | (auto)>
  videos     = <M | (auto)>
  music      = <N | (auto, default 4 trong [3,5])>
  style      = <id | (recommend sau genre detect)>
  force_redo = <true | false>
  epic       = <true | false>
```

(`--epic` bơm scale: bump `recommended_mix` band một nấc + ưu tiên spectacle rộng
ở planner/expander, NHƯNG vẫn giữ no-fabrication — chỉ amplify cảnh có thật, không
bịa combat/đại quân.)

---

## STEP 1 — LOAD INPUT

```bash
python3 scripts/load_input.py "<input_path>" > .work/chapters.json
```

(Tạo `.work/` cạnh input nếu chưa có. Tất cả `.work/...` paths bên dưới là
relative tới `<input_dir>/.work/`.)

Compute `input_hash = sha1(file_bytes(input_path))[:12]` → ghi vào
`.work/input.hash` (file plain text 1 dòng).

Đếm chapters K. Print: `Loaded K chapters.`

---

## STEP 1.5 — QA PROOFREAD (resume-safe loop, always runs)

Cổng hiệu đính: sửa ký tự Trung/Anh còn sót, chính tả/ngữ pháp, câu dịch máy
lủng củng, tách câu quá dài. Mức vừa phải — KHÔNG đổi cốt truyện/tên riêng/số.
Đầu ra `chapters_qa.json` là nguồn duy nhất cho mọi bước sau, và `<stem>_qa.txt`
là file đọc TTS.

Nếu `--force-redo`: `rm -f .work/qa-chapter-*.md` TRƯỚC khi vào loop.

Load `.work/chapters.json`. For mỗi chapter row (theo thứ tự id):

  qa_path = `.work/qa-chapter-<NNN>.md` (NNN = zero-padded chapter id)

  expected_cache_key = sha1(input_hash + serialize(chapter_row))[:16]

  a. Nếu qa_path tồn tại VÀ KHÔNG `--force-redo`:
     - Đọc frontmatter `cache_key`. Match expected → skip ("chương NNN: cached");
       GOTO next chapter.
     - Mismatch → WARN "chương NNN stale — regenerating"; xóa file, regenerate.

  b. Load `@prompts/qa-proofread.md` + execute trên chapter_row (truyền
     `input_hash`) → write qa_path với frontmatter `{chapter_id, title, cache_key}`.

  c. Log: `QA chương <NNN>/<K> done`.

Sau loop:

```bash
python3 scripts/assemble_qa.py --input "<input_path>"
```

Parse stdout JSON. Compute `qa_hash = sha1(file_bytes(.work/chapters_qa.json))[:12]`
→ ghi vào `.work/qa.hash`.

Print: `QA hoàn tất: <chapter_count> chương → chapters_qa.json + <stem>_qa.txt`.

(Từ đây mọi bước đọc `.work/chapters_qa.json`, KHÔNG đọc `chapters.json` nữa.)

---

## STEP 2 — CHARACTER BIBLE

Resolve `bible_path`:
- Nếu `--series NAME`: `bible_path = ~/.gemini/bibles/<NAME>.md`
- Else: `bible_path = <input_dir>/character-bible.md`

Nếu `bible_path` đã tồn tại:
- Load `@prompts/bible-augmenter.md` + execute (append-only via
  `scripts/append_bible_row.py`).
Else:
- Load `@prompts/bible-extractor.md` + execute (write fresh bible).

Compute `bible_hash = sha1(file_bytes(bible_path))[:12]` → ghi vào
`.work/bible.hash`.

---

## STEP 3 — GENRE DETECT

Nếu `--genre` flag set → skip detection, dùng giá trị flag.
Else: load `@prompts/genre-detector.md` + execute (sample 3 chapters).

Nếu detector trả `GENRE REFUSED` → HALT toàn workflow ngay. Không tạo file
output. In refusal message rồi exit.

---

## STEP 3.5 — STYLE RECOMMEND + SELECT (mandatory)

Chọn art style cho cả run. Genre và style tách rời — mọi style trong
`@references/style-catalog.md` đều hợp lệ cho mọi genre.

**Nếu `style_override` được set:**
- Validate id ∈ style-catalog (đọc bảng tra nhanh id→category ở đầu
  `@references/style-catalog.md`). Sai → HALT với VN error:
  `Lỗi: --style '<id>' không hợp lệ. Id hợp lệ: <liệt kê 18 id từ bảng tra nhanh>`
- `chosen_style = style_override` (KHÔNG hỏi).

**Else (no flag):**
- Load `@prompts/style-recommender.md` với `genre` đã detect → in recommend #1 +
  2-3 alternatives + cảnh báo consistency (nếu style accent/video).
- HỎI user: Enter = #1, hoặc gõ một id khác. Validate id ∈ catalog (sai → in lỗi
  + hỏi lại). `chosen_style` = kết quả.
- **FALLBACK (headless / không nhận được câu trả lời tương tác):**
  `chosen_style = recommend #1`; in:
  `Style mặc định: <id> (recommend cho <genre>). Override: --style <id>.`

**Materialize:**
- Copy NGUYÊN VĂN entry của `chosen_style` từ `style-catalog.md` (chỉ 1 entry,
  từ dòng `### <id> — ...` tới ngay trước entry kế / hết phần Entries) →
  `.work/active-style.md`.
- `style_hash = sha1(file_bytes(.work/active-style.md))[:12]` → ghi `.work/style.hash`.
- Print: `Style: <id> (<category>)`.

(Từ đây image/video expander + music builder đọc `.work/active-style.md`.)

---

## STEP 4 — SCENE COUNT

```bash
python3 scripts/calc_scene_count.py \\
    --input "<input_path>" \\
    --chapters-json .work/chapters_qa.json \\
    [--images <N>] [--videos <M>] [--epic]
```

(Thêm `--epic` vào lệnh nếu `epic` flag set ở STEP 0.)

Parse stdout JSON → lưu `images_n`, `videos_m`, `action_density`, `recommended_mix`.

Default auto path tạo khoảng 120–150 image prompts và tối thiểu 20 video prompts.
Nếu user truyền `--images` hoặc `--videos`, tôn trọng override đúng số đó.

`action_density` (low/medium/high) đo bằng combat-vocab scan — quyết định
`recommended_mix` band. Truyện ít hành động → action band thấp, KHÔNG ép quota
combat. Band này được truyền vào scene-planner ở STEP 5.

Print: `Sẽ tạo: <images_n> ảnh + <videos_m> video clip. (action_density: <density>)`

---

## STEP 5 — SCENE PLAN (Pass 1)

Nếu `.work/scene-plan.md` tồn tại VÀ KHÔNG có `--force-redo`:
- Check cache: `expected_plan_key = sha1(qa_hash + bible_hash + images_n + videos_m)`
- Đọc frontmatter `cache_key` từ scene-plan.md (nếu có). Match → skip.
- Mismatch → WARN "scene-plan stale (input/bible/count changed) — regenerating"
  → tiếp tục.

Load `@prompts/scene-planner.md` + execute → write `.work/scene-plan.md`.
Truyền vào context của planner: `images_n`, `videos_m`, `action_density`,
`recommended_mix` (từ STEP 4), và `epic` (true nếu flag set — planner dùng band
đã bump + ưu tiên spectacle, nhưng KHÔNG fabricate combat).

Compute `plan_hash = sha1(file_bytes(scene-plan.md))[:12]` → ghi vào
`.work/plan.hash`.

Print: `Scene plan: <N> scenes, <M> flagged for video.`

---

## STEP 5.5 — PLAN VARIATION GATE (deterministic backstop)

Chạy sau khi scene-plan ghi xong. Bắt monotony (adjacent-duplicate) + synopsis
fragment để không lọt im lặng xuống expander.

```bash
python3 scripts/validate_scene_plan.py --plan .work/scene-plan.md
```

Parse stdout JSON `{total, violations, ok}`. Exit 0 = ok, 2 = có violations,
1 = IO error (in lỗi rồi proceed).

**Bounded revise loop (tối đa 2 lần):**
- Nếu `ok: true` → proceed STEP 6.
- Nếu có violations VÀ còn lượt retry:
  - Gom `scene_ids` bị flag. Load `@prompts/scene-planner.md` và yêu cầu CHỈ
    sửa các row bị flag (revise-flagged contract): đổi scene_tag / nhân vật focus
    cho `adjacent_duplicate`; viết lại synopsis thành 1 câu mạch lạc cho
    `fragment_synopsis`. Ghi đè scene-plan.md, recompute `plan_hash`.
  - Chạy lại validator.
- Sau 2 lượt mà vẫn còn violations → WARN liệt kê violations còn lại, KHÔNG
  hard-block, proceed STEP 6.

Print: `Plan gate: <ok | N violations sau <r> revise>`.

---

## STEP 6 — EXPAND SCENES (Pass 2, resume-safe loop)

Nếu `--force-redo`: `rm -f .work/scene-*.md` TRƯỚC khi vào loop.

For mỗi scene row trong scene-plan (theo thứ tự scene_id 1..N):

  scene_path = `.work/scene-<NNN>.md` (NNN = zero-padded scene_id)

  expected_cache_key = sha1(
      qa_hash + bible_hash + plan_hash + style_hash + serialize(scene_row)
  )[:16]

  a. Nếu scene_path tồn tại VÀ KHÔNG `--force-redo`:
     - Đọc frontmatter, lấy `cache_key`.
     - Match expected → skip ("scene NNN: cached"); GOTO next scene.
     - Mismatch → WARN "scene NNN stale (input/bible/plan/style changed) — regenerating";
       xóa file, regenerate.

  b. Load relevant chapter text từ chapters_qa.json (chỉ chapter mà scene_row.chapter
     trỏ tới — KHÔNG load full JSON).

  c. Load `@prompts/prompt-expander-image.md` + execute → write scene_path
     với frontmatter:
     ```
     ---
     scene_id: <NNN>
     cache_key: <expected_cache_key>
     has_video: <true|false>
     ---
     ## Image Prompt
     ...
     ```

  d. Nếu scene_row.flag_for_video = ✓:
     Load `@prompts/prompt-expander-video.md` + execute → append
     `## Video Prompt` block vào scene_path.

  e. Log: `Scene <NNN>/<N> done (<image_wc>w image[, <video_wc>w video])`

---

## STEP 6.5 — MUSIC PROMPTS (resume-safe loop)

Sinh prompt nhạc nền Lyria 3 (instrumental) theo cung bậc cảm xúc truyện.

Resolve số vùng N:
- Nếu `--music N` với N ≥ 1 → dùng ĐÚNG N (verbatim, KHÔNG clamp).
- Nếu `--music 0` → WARN "Lỗi: --music phải ≥ 1; bỏ qua, dùng mặc định adaptive"
  → fallback sang path adaptive.
- Else (adaptive, không có flag hợp lệ): mặc định 4, clamp [3, 5]. Clamp CHỈ cho
  path adaptive này.

Nếu `--force-redo`: `rm -f .work/music-*.md` TRƯỚC khi vào loop.

Load `@prompts/music-prompt-builder.md` để LLM phân vùng arc thành N vùng cảm
xúc liền kề (mỗi vùng = dải `Chương X-Y`, phủ hết 1..K, không chồng lấn), dùng
`genre`, `.work/scene-plan.md`, `.work/chapters_qa.json`, `.work/active-style.md`,
`qa_hash`, `plan_hash`, `style_hash`.

For mỗi vùng region (loop_index 1..N):

  music_path = `.work/music-<NNN>.md` (NNN = zero-padded loop_index)

  expected_cache_key = sha1(
      qa_hash + genre + plan_hash + style_hash + serialize(region_spec)
  )[:16]
  (region_spec = {loop_index, total, chapter_start, chapter_end, mood})

  a. Nếu music_path tồn tại VÀ KHÔNG `--force-redo`:
     - Đọc frontmatter `cache_key`. Match → skip ("music NNN: cached").
     - Mismatch → WARN "music NNN stale (input/plan/style changed) — regenerating";
       xóa, regenerate.

  b. Execute music-prompt-builder cho vùng này → write music_path với
     frontmatter `{loop_index, total, chapter_start, chapter_end, mood, cache_key}`
     + body = khối Lyria prompt (English) có nhãn VN, `Instrumental.`, dòng
     Negative, dòng Loop.

  c. Log: `Music <NNN>/<N> done (mood: <bucket>, Chương <X>-<Y>)`.

(Bước STEP 7 assemble sẽ tự gom `music-*.md` → `<stem>_music_prompts.txt`.)

---

## STEP 7 — ASSEMBLE + DEPTH GATE (assemble → validate → bounded regen)

```bash
python3 scripts/assemble_outputs.py --input "<input_path>"
```

Parse stdout JSON. Ngoài summary, đọc `violations: [{scene_id, kind, detail}]`.
Mỗi violation = block nông: thiếu header / sai word-count / negative < 20 (image)
hoặc thiếu header / sai beat count / >3800 chars (video). assemble VẪN ghi `.txt`
(nên run cuối cùng luôn dùng được) — nhưng cố làm sạch violations trước.

**Bounded regen loop (tối đa 2 lần):**
- Nếu `violations` rỗng → proceed POST-RUN SUMMARY.
- Nếu có violations VÀ còn lượt retry:
  - Với mỗi `scene_id` bị flag: `rm -f .work/scene-<NNN>.md`, chạy lại STEP 6
    expander cho scene đó (image; thêm video nếu scene có video hoặc bị flag
    `kind: video`), tôn trọng self-check sâu + char cap 3800.
  - Chạy lại `assemble_outputs.py`, đọc lại `violations`.
- Sau 2 lượt mà vẫn còn violations → WARN liệt kê violations còn lại, giữ output
  tốt nhất, proceed (KHÔNG vòng lặp vô hạn, KHÔNG crash).

Print: `Depth gate: <clean | N violations sau <r> regen>`.

---

