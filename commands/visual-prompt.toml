## STEP 1.5 — QA PROOFREAD (resume-safe loop, always runs)

Cổng hiệu đính: sửa ký tự Trung/Anh còn sót, chính tả/ngữ pháp, câu dịch máy
lủng củng, tách câu quá dài. Mức vừa phải — KHÔNG đổi cốt truyện/tên riêng/số.
Đầu ra `chapters_qa.json` là nguồn duy nhất cho mọi bước sau, và `<stem>_qa.txt`
là file đọc TTS.

Nếu `--force-redo`: `rm -f .work/qa-chapter-*.md` TRƯỚC khi vào loop.

Load `.work/chapters.json`. For mỗi chapter row (theo thứ tự id):

  qa_path = `.work/qa-chapter-<NNN>.md` (NNN = zero-padded chapter id)

  expected_cache_key = sha1(input_hash + serialize(chapter_row))[:16]

  a. Nếu qa_path tồn tại VÀ KHÔNG `--force-redo`:
     - Đọc frontmatter `cache_key`. Match expected → skip ("chương NNN: cached");
       GOTO next chapter.
     - Mismatch → WARN "chương NNN stale — regenerating"; xóa file, regenerate.

  b. Load `@prompts/qa-proofread.md` + execute trên chapter_row (truyền
     `input_hash`) → write qa_path với frontmatter `{chapter_id, title, cache_key}`.

  c. Log: `QA chương <NNN>/<K> done`.

Sau loop:

```bash
python3 scripts/assemble_qa.py --input "<input_path>"
```

Parse stdout JSON. Compute `qa_hash = sha1(file_bytes(.work/chapters_qa.json))[:12]`
→ ghi vào `.work/qa.hash`.

Print: `QA hoàn tất: <chapter_count> chương → chapters_qa.json + <stem>_qa.txt`.

(Từ đây mọi bước đọc `.work/chapters_qa.json`, KHÔNG đọc `chapters.json` nữa.)

