## STEP 3 — GENRE DETECT

Nếu `--genre` flag set → skip detection, dùng giá trị flag.
Else: load `@prompts/genre-detector.md` + execute (sample 3 chapters).
Ghi genre cuối cùng vào `.work/genre.txt`.

Nếu detector trả `GENRE REFUSED` → HALT toàn workflow ngay. Không tạo file
output. In refusal message rồi exit.

