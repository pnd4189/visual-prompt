## UNATTENDED AUTO-REPAIR APPROVAL

Nếu args có `--auto-repair`, batch operator đã duyệt trước đúng kế hoạch sửa các
artifact được external gate flag. Mọi yêu cầu “share a plan and wait for
acknowledgement” đã được thỏa mãn bởi flag này. Không hỏi lại, không xuất một kế
hoạch thay cho hành động, và không chờ thêm input; bắt đầu tool execution ngay.
Nếu một instruction ưu tiên cao hơn vẫn bắt buộc trình kế hoạch, kết thúc kế hoạch
bằng đúng một dòng `BATCH_APPROVAL_REQUIRED:<batch_token>` rồi chờ. Không nhắc lại
marker này ở vị trí khác. Sau khi nhận xác nhận trong cùng conversation, thực thi
ngay. Chỉ khi toàn bộ workflow đã chạy xong, kết thúc bằng đúng một dòng
`BATCH_RUN_COMPLETE:<batch_token>`; nếu phải HALT vì lỗi thật, kết thúc bằng đúng
một dòng `BATCH_RUN_HALTED:<batch_token>`. Không in marker hoàn tất/halt sớm hơn.

