## STEP 6 — EXPAND SCENES (Pass 2, resume-safe loop)

**PRECONDITION (bắt buộc):** `.work/scene-plan.md` PHẢI tồn tại (từ STEP 5) và đã
qua STEP 5.5. Nếu chưa có → quay lại STEP 5. KHÔNG bắt đầu sinh prompt mà không có
scene-plan.

**PARALLEL EXPANSION — cách DUY NHẤT được phép chạy song song:**
Sinh 120-150 prompt tuần tự trong 1 context là chậm; nếu muốn song song, làm ĐÚNG
cách sau (KHÔNG tự chế brief khác):
- Mặc định parallelism = TỐI ĐA 3 subagent đồng thời (không phải 5+). Mỗi subagent
  một dải scene_id; spawn lần lượt theo wave, không bung hết một lúc. Run lớn
  (>90 cảnh) đụng rate-limit dễ hơn → giữ 3, ưu tiên hoàn tất chắc hơn nhanh.
- Trước khi spawn subagent, detect work path. Nếu `<input_dir>` hoặc `.work` nằm
  dưới `/home/*/cloud/gdrive/` hoặc `/home/*/.cache/rclone/`, KHÔNG cho subagent
  ghi trực tiếp vào path đó. Dùng một trong hai path an toàn:
  1. parent-agent loop tuần tự ghi `.work/scene-NNN.md`; hoặc
  2. subagent ghi vào local staging dir `/tmp/visual-prompt-<input_hash>/scenes-XXX-YYY/`,
     rồi parent copy từng file sang `.work/` bằng Python/open + verify.
- Chia danh sách scene_id thành các batch, mỗi batch có expected_ids rõ ràng.
- Mỗi subagent nhận: (a) một dải scene_id, (b) bắt buộc đọc CHÍNH các file
  `@prompts/prompt-expander-image.md` + `@prompts/prompt-expander-video.md` +
  `@references/visual-prompt-template.md` + `.work/active-style.md`, (c) đọc đúng
  các row tương ứng trong `.work/scene-plan.md` và CHỈ chương mà mỗi row trỏ tới từ
  `.work/chapters_qa.json`, (d) trả/ghi mỗi cảnh đúng format `scene-NNN.md`.
- Subagent KHÔNG được tự đặt template "mọi ảnh = nhân vật chính"; Subject mỗi cảnh =
  đúng `scene_row.characters`. Đa dạng cảnh do scene-plan quyết định, không phải do
  subagent rút gọn.
- KHÔNG tự ghi file output cuối — vẫn để STEP 7 `assemble_outputs.py` gom từ scene-*.md.

**RATE-LIMIT / 429 (RESOURCE_EXHAUSTED) — bắt buộc xử lý, KHÔNG improvise:**
Spawn nhiều subagent ở scale lớn rất dễ đụng 429. Khi gặp 429/RESOURCE_EXHAUSTED:
- KHÔNG retry ngay (sẽ đụng lại). KHÔNG tự chế Python generator deterministic để né
  (vi phạm EXECUTION CONTRACT #5 — output sẽ template-hoá). KHÔNG gọi `gemini` CLI
  hay model API/LLM ngoài để né rate-limit (vi phạm RULE 0 — bạn phải tự sinh prompt).
- Backoff: dừng spawn wave mới, đợi 30s → 60s → 120s (exponential) giữa các lần thử.
- Nếu sau 2 lần backoff vẫn 429: CHUYỂN sang parent-agent loop TUẦN TỰ cho các
  scene_id còn thiếu — parent tự expand từng cảnh theo `@prompts/prompt-expander-*.md`
  (đúng pipeline LLM, 1 cảnh/lần, ghi `.work/scene-NNN.md` rồi verify). Chậm hơn
  nhưng đúng thiết kế và không đụng giới hạn song song.
- Loop tuần tự là resume-safe (xem cache_key bên dưới): cảnh đã có thì skip, chỉ
  sinh cảnh thiếu. Có thể chạy nhiều lượt cho tới khi đủ N cảnh.

**BATCH ARTIFACT GATE (bắt buộc sau mỗi batch/subagent):**
- Parent kiểm tra exact files expected: `scene-<NNN>.md` cho từng expected_id.
- Mỗi file phải size > 0, có frontmatter `scene_id/cache_key/has_video`, có
  `## Image Prompt`, và nếu scene flag video thì có `## Video Prompt`.
- Nếu subagent report completed nhưng produced_count = 0 hoặc thiếu bất kỳ expected_id:
  FAIL-FAST batch đó. Không chờ "sync delay" mơ hồ.
- Retry tối đa 1 lần bằng parent-agent loop cho đúng missing IDs. Nếu vẫn thiếu,
  HALT với danh sách missing files; không kill batch khác không liên quan.
- Ghi log batch ngắn: `Batch XXX-YYY: expected A, produced B, missing [..]`.

Nếu `--force-redo`: `rm -f .work/scene-*.md` TRƯỚC khi vào loop.

For mỗi scene row trong scene-plan (theo thứ tự scene_id 1..N):

  scene_path = `.work/scene-<NNN>.md` (NNN = zero-padded scene_id)

  expected_cache_key = sha1(
      qa_hash + bible_hash + plan_hash + style_hash + serialize(scene_row)
  )[:16]

  a. Nếu scene_path tồn tại VÀ KHÔNG `--force-redo`:
     - Đọc frontmatter, lấy `cache_key`.
     - Match expected → skip ("scene NNN: cached"); GOTO next scene.
     - Mismatch → WARN "scene NNN stale (input/bible/plan/style changed) — regenerating";
       xóa file, regenerate.

  b. Load relevant chapter text từ chapters_qa.json (chỉ chapter mà scene_row.chapter
     trỏ tới — KHÔNG load full JSON).

  c. Load `@prompts/prompt-expander-image.md` + execute (truyền `mode` từ STEP 4
     để expander biết spectacle/faithful) → write scene_path với frontmatter:
     ```
     ---
     scene_id: <NNN>
     cache_key: <expected_cache_key>
     has_video: <true|false>
     ---
     ## Image Prompt
     ...
     ```

  d. Nếu scene_row.flag_for_video = ✓ VÀ KHÔNG có `no_video` ở STEP 0:
     Load `@prompts/prompt-expander-video.md` + execute → append
     `## Video Prompt` block vào scene_path.
     (Nếu `no_video = true` ở STEP 0: skip hoàn toàn, KHÔNG gọi video expander,
     frontmatter giữ `has_video: false`. scene-planner.md đã được hướng dẫn
     không flag scene nào trong trường hợp này.)

  e. Log: `Scene <NNN>/<N> done (<image_wc>w image[, <video_wc>w video])`

Sau STEP 6, parent chạy artifact gate toàn cục:
```bash
python3 scripts/validate_artifacts.py \
  --check scenes \
  --work-dir "<work_dir>" \
  --scene-plan "<work_dir>/scene-plan.md"
```

