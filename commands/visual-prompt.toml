## PLAN-ONLY SUBMODE (head của bounded-parallel run, batch-runner-invoked)

Nếu args có `--plan-only`, đây là head session của bounded-parallel run do batch
runner spawn: chạy STEP 1 → STEP 5.5 (load input, continuity, QA, bible, genre,
style, scene count, scene plan Pass 1 + plan variation gate) rồi DỪNG.

- Không chạy STEP 6 (Pass-2 expand), STEP 6.5 (music), STEP 7 (assemble/gates),
  STEP 8 (self-audit). Không ghi scene-NNN.md, không ghi completion marker file,
  không publish visual-history. Pass-2 do các worker session riêng làm.
- `--plan-only` chỉ đi cùng `--auto-repair` + `--batch-token` (batch context);
  loại trừ `--worker-manifest`, `--similarity-feedback`, `--force-redo` (head
  không sửa artifact của worker; nếu scene-plan cần làm lại, runner quyết định).
- Sau khi STEP 5.5 pass và `.work/plan.hash` đã ghi: kết thúc bằng đúng một dòng
  `BATCH_RUN_COMPLETE:<batch_token>`. Gate FAIL hoặc lỗi thật →
  `BATCH_RUN_HALTED:<batch_token>`.
- Run trực tiếp của user KHÔNG BAO GIỜ dùng `--plan-only`; full pipeline mặc định
  giữ nguyên khi không có flag.

