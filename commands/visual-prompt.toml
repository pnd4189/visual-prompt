## STEP 3.5 — STYLE RECOMMEND + SELECT (mandatory)

Chọn art style cho cả run. Genre và style tách rời — mọi style trong
`@references/style-catalog.md` đều hợp lệ cho mọi genre.

**Nếu `style_override` được set:**
- Validate id ∈ style-catalog (đọc bảng tra nhanh id→category ở đầu
  `@references/style-catalog.md`). Sai → HALT với VN error:
  `Lỗi: --style '<id>' không hợp lệ. Id hợp lệ: <liệt kê 18 id từ bảng tra nhanh>`
- `chosen_style = style_override` (KHÔNG hỏi).

**Else (no flag):**
- Load `@prompts/style-recommender.md` với `genre` đã detect → in recommend #1 +
  2-3 alternatives + cảnh báo consistency (nếu style accent/video).
- HỎI user: Enter = #1, hoặc gõ một id khác. Validate id ∈ catalog (sai → in lỗi
  + hỏi lại). `chosen_style` = kết quả.
- **FALLBACK (headless / không nhận được câu trả lời tương tác):**
  `chosen_style = recommend #1`; in:
  `Style mặc định: <id> (recommend cho <genre>). Override: --style <id>.`

**Materialize:**
- Copy NGUYÊN VĂN entry của `chosen_style` từ `style-catalog.md` (chỉ 1 entry,
  từ dòng `### <id> — ...` tới ngay trước entry kế / hết phần Entries) →
  `.work/active-style.md`.
- `style_hash = sha1(file_bytes(.work/active-style.md))[:12]` → ghi `.work/style.hash`.
- Print: `Style: <id> (<category>)`.

(Từ đây image/video expander + music builder đọc `.work/active-style.md`.)

