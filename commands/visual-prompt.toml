## STEP 6.5 — MUSIC PROMPTS (resume-safe loop)

Sinh prompt nhạc nền Lyria 3 (instrumental) theo cung bậc cảm xúc truyện.
Tất cả loop phải là nhạc nền không lời, nhẹ nhàng, sâu lắng, cảm xúc, có màu sắc
tiên hiệp/kiếm hiệp để nằm dưới giọng đọc. Không tạo trailer music, battle music,
fast action cue, war drums dồn dập, stinger, crescendo quá mạnh, hoặc nhạc căng
thẳng lấn át narration.

Resolve số vùng N:
- Nếu `--music N` với N ≥ 1 → dùng ĐÚNG N (verbatim, KHÔNG clamp).
- Nếu `--music 0` → WARN "Lỗi: --music phải ≥ 1; bỏ qua, dùng mặc định adaptive"
  → fallback sang path adaptive.
- Else (adaptive, không có flag hợp lệ): mặc định 4, clamp [3, 5]. Clamp CHỈ cho
  path adaptive này.

Nếu `--force-redo`: `rm -f .work/music-*.md` TRƯỚC khi vào loop.

Load `@prompts/music-prompt-builder.md` để LLM phân vùng arc thành N vùng cảm
xúc liền kề (mỗi vùng = dải `Chương X-Y`, phủ hết 1..K, không chồng lấn), dùng
`genre`, `.work/scene-plan.md`, `.work/chapters_qa.json`, `.work/active-style.md`,
`qa_hash`, `plan_hash`, `style_hash`.

Music file write cũng theo quy tắc parent-owned artifact: nếu dùng subagent,
subagent chỉ trả content hoặc ghi local staging; parent ghi/copy `.work/music-NNN.md`
và verify size > 0 + frontmatter + body. Không viết tay trực tiếp vào final
`<stem>_music_prompts.txt`.

For mỗi vùng region (loop_index 1..N):

  music_path = `.work/music-<NNN>.md` (NNN = zero-padded loop_index)

  expected_cache_key = sha1(
      qa_hash + genre + plan_hash + style_hash + serialize(region_spec)
  )[:16]
  (region_spec = {loop_index, total, chapter_start, chapter_end, mood})

  a. Nếu music_path tồn tại VÀ KHÔNG `--force-redo`:
     - Đọc frontmatter `cache_key`. Match → skip ("music NNN: cached").
     - Mismatch → WARN "music NNN stale (input/plan/style changed) — regenerating";
       xóa, regenerate.

  b. Execute music-prompt-builder cho vùng này → write music_path với
     frontmatter `{loop_index, total, chapter_start, chapter_end, mood, cache_key}`
     + body = khối Lyria prompt (English) theo template:
     một paragraph prompt 55-85 words kết thúc bằng
     `loop-ready 2-3 minute seamless background loop, no vocals, no lyrics, instrumental only.`
     rồi một dòng `Tags:` 12-16 tags. Không dùng `--- LOOP`, `Negative:`, hoặc
     `Loop:` trong body final.

  c. Log: `Music <NNN>/<N> done (mood: <bucket>, Chương <X>-<Y>)`.

(Bước STEP 7 assemble sẽ tự gom `music-*.md` → `<stem>_music_prompts.txt`.)

Sau STEP 6.5, parent kiểm tra exact `music-001.md` ... `music-<N>.md`. Nếu thiếu
hoặc file rỗng, retry missing IDs bằng parent loop tối đa 1 lần; vẫn lỗi thì HALT
với danh sách missing. Không tiếp tục assemble với music_count sai.

```bash
python3 scripts/validate_artifacts.py \
  --check music \
  --work-dir "<work_dir>" \
  --expected-music <music_n>
```

