## STEP 0 — FLAG PARSE (mandatory, run first)

Args là 1 string. Parse như sau (regex Python):

1. `--series ([a-z0-9-]+)`              → series_name (kebab-case, optional)
2. `--genre (tien-hiep|huyen-huyen|do-thi|co-dien|vo-hiep)` → genre_override (optional)
3. `--images (\\d+)`                     → images_override (optional, int)
4. `--videos (\\d+)`                     → videos_override (optional, int)
5. `--music (\\d+)`                      → music_override (optional, int; honored verbatim)
6. `--style ([a-z0-9-]+)`                → style_override (kebab-case id, optional)
7. `--force-redo`                        → force_redo = true (flag)
8. `--epic`                              → epic = true (flag)
9. `--faithful`                          → faithful = true (flag)
10. `--no-video`                          → no_video = true (flag; skip video expander + skip writing _video_prompts.txt)
11. Sau khi strip flags → còn lại là input_path (positional, required).

Validate:
- input_path tồn tại (Path.exists()).
- Nếu có unknown flag (bắt đầu `--` nhưng không match list trên) → HALT với VN error:
  `Lỗi: flag không hỗ trợ. Hỗ trợ: --series NAME, --genre NAME, --images N, --videos M, --music N, --style ID, --force-redo, --epic, --faithful, --no-video`

Echo lại cho user:
```
Đã nhận flags:
  input_path = <path>
  series     = <name | (none, per-file bible)>
  genre      = <override | (auto-detect)>
  images     = <N | (auto)>
  videos     = <M | (auto)>
  music      = <N | (auto, default 4 trong [3,5])>
  style      = <id | (recommend sau genre detect)>
  force_redo = <true | false>
  epic       = <true | false>
  faithful   = <true | false>
  no_video   = <true | false>
```

(Mặc định = **spectacle**: planner/expander chủ động dựng cảnh giàu kịch tính —
map/phong cảnh rộng, đông nhân vật trong khung, combat, đấu pháp — và ĐƯỢC PHÉP
dramatize vượt text, miễn giữ nhất quán genre + identity bible + continuity.
`--epic` bơm scale mạnh hơn nữa. `--faithful` chuyển sang chế độ content-aware
trung thành text: KHÔNG bịa combat/đại quân không có trong truyện.)

