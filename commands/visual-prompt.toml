## STEP 6.5 — MUSIC PROMPTS (resume-safe loop)

Nếu `music_enabled = false` (mặc định): đặt `music_n = 0`, không load
`@prompts/music-prompt-builder.md`, không tạo `music-plan.md`/`music-NNN.md`, và
chuyển thẳng sang STEP 7. Không suy diễn yêu cầu nhạc từ mục tiêu “YouTube”.

Sinh prompt nhạc nền Lyria 3 (instrumental) theo cung bậc cảm xúc truyện.
Tất cả loop phải là nhạc nền không lời, nhẹ nhàng, sâu lắng, cảm xúc, có màu sắc
tiên hiệp/kiếm hiệp để nằm dưới giọng đọc. Không tạo trailer music, battle music,
fast action cue, war drums dồn dập, stinger, crescendo quá mạnh, hoặc nhạc căng
thẳng lấn át narration.

Resolve số vùng N:
- Nếu `--music N` với N ≥ 1 → dùng ĐÚNG N (verbatim, KHÔNG clamp).
- Nếu `--music 0` → HALT: `Lỗi: --music N yêu cầu N ≥ 1.`
- Nếu dùng `--music` không có N: mặc định 4, clamp [3, 5]. Clamp CHỈ cho path
  adaptive này.

Nếu `--force-redo`: `rm -f .work/music-*.md` (gồm cả `music-plan.md`) trước loop.

Persist segmentation trong `.work/music-plan.md`:
- `music_plan_key = sha1(NUL-join(qa_hash, genre, plan_hash, music_n))[:16]`.
- Nếu file tồn tại, key match, và không force-redo: reuse nguyên văn bảng region
  `{loop_index, chapter_start, chapter_end, mood}`.
- Nếu thiếu/stale: load `@prompts/music-prompt-builder.md`, chia arc đúng một lần,
  với `task_mode=plan_regions`, rồi ghi frontmatter
  `{cache_key,qa_hash,genre,plan_hash,style_hash,music_n}` + bảng có header
  chính xác `loop_index | chapter_start | chapter_end | mood`, phủ liên tục từ
  chapter ID đầu đến cuối trong chapters_qa. Không phân vùng lại trong loop.
  Nếu có series visual-history, truyền nó vào builder.

Builder dùng `genre`, scene-plan, chapters_qa, active-style, hashes, và region từ
music-plan; chỉ regenerate file loop thiếu/stale.

Music file write cũng theo quy tắc active-model-owned artifact: chính bạn ghi
`.work/music-NNN.md` và verify size > 0 + frontmatter + body. Không viết tay trực
tiếp vào final `<stem>_music_prompts.txt`.

For mỗi vùng region (loop_index 1..N):

  music_path = `.work/music-<NNN>.md` (NNN = zero-padded loop_index)

  expected_cache_key = sha1(NUL-join(
      qa_hash, genre, plan_hash, style_hash, canonical_region_json
  ))[:16]
  với `canonical_region_json` = compact JSON, sort key của
  `{loop_index,total,chapter_start,chapter_end,mood}`.

  a. Nếu music_path tồn tại VÀ KHÔNG `--force-redo` VÀ loop_index không có trong
     `music_rewrite_loop_ids` của `similarity_feedback_path`:
     - Đọc frontmatter `cache_key`. Match → skip ("music NNN: cached").
     - Mismatch → WARN "music NNN stale (input/plan/style changed) — regenerating";
       xóa, regenerate.

  b. Execute music-prompt-builder với `task_mode=write_region`, `music-plan` và
     đúng `region_spec` của vùng này → write music_path với
     frontmatter `{loop_index, total, chapter_start, chapter_end, mood, cache_key}`
     + body = khối Lyria prompt (English) theo template:
     một paragraph prompt 55-85 words kết thúc bằng
     `loop-ready 2-3 minute seamless background loop, no vocals, no lyrics, instrumental only.`
     rồi một dòng `Tags:` 12-16 tags. Không dùng `--- LOOP`, `Negative:`, hoặc
     `Loop:` trong body final.

  c. Log: `Music <NNN>/<N> done (mood: <bucket>, Chương <X>-<Y>)`.

(Bước STEP 7 assemble sẽ tự gom `music-*.md` → `<stem>_music_prompts.txt`.)

Sau STEP 6.5, parent kiểm tra exact `music-001.md` ... `music-<N>.md`. Nếu thiếu
hoặc file rỗng, retry missing IDs bằng parent loop tối đa 1 lần; vẫn lỗi thì HALT
với danh sách missing. Không tiếp tục assemble với music_count sai.

```bash
python3 scripts/validate_artifacts.py \
  --check music \
  --work-dir "<work_dir>" \
  --expected-music <music_n> \
  --qa-hash "<qa_hash>" --genre "<genre>" \
  --plan-hash "<plan_hash>" --style-hash "<style_hash>"
```
Validator ưu tiên region trong `.work/music-plan.md`; `--expected-music` chỉ là
fallback cho run cũ chưa có plan.

---

## STEP 7 — ASSEMBLE + DEPTH GATE (assemble → validate → bounded regen)

```bash
python3 scripts/assemble_outputs.py --input "<input_path>" \
  [--video when video_enabled] [--music when music_enabled]
```
Không truyền `--video`/`--music` khi medium tương ứng bị tắt. Khi tắt, helper
không được discover, validate, assemble, hoặc report file optional nào.

Parse stdout JSON. Ngoài summary, đọc `violations: [{scene_id, kind, detail}]`.
Mỗi violation = block nông: thiếu header / sai word-count / negative < 20 (image)
hoặc thiếu header / sai beat count / >3800 chars (video). assemble VẪN ghi `.txt`
(nên run cuối cùng luôn dùng được) — nhưng cố làm sạch violations trước.

Sau mỗi lần assemble, verify output files trên filesystem:
- `_image_prompts.txt` tồn tại, size > 0, số block `--- SCENE NNN ---` = image_count.
- `_video_prompts.txt` chỉ được kiểm tra khi `video_enabled = true`; khi đó size > 0
  và block count = video_count.
- `_music_prompts.txt` chỉ được kiểm tra khi `music_enabled = true`; khi đó size > 0
  và block count = music_count.
Nếu any check fail → rerun `assemble_outputs.py` một lần; vẫn fail thì HALT. Không
tự tay viết final output để "cứu" run.

```bash
python3 scripts/validate_artifacts.py \
  --check outputs \
  --input "<input_path>" \
  --image-count <image_count> \
  --video-count <video_count> \
  --music-count <music_count>
```

**Bounded regen loop (tối đa 2 lần):**
- Nếu `violations` rỗng → proceed POST-RUN SUMMARY.
- Nếu có violations VÀ còn lượt retry:
  - Với mỗi `scene_id` bị flag: `rm -f .work/scene-<NNN>.md`, chạy lại STEP 6
    expander cho scene đó (image; thêm video nếu scene có video hoặc bị flag
    `kind: video`), tôn trọng self-check sâu + char cap 3800.
  - Chạy lại `assemble_outputs.py`, đọc lại `violations`.
- Sau 2 lượt mà vẫn còn violations → HALT liệt kê violations còn lại. Không giữ
  output nông để báo thành công.

Print: `Depth gate: <clean | N violations sau <r> regen>`.

### STEP 7.3 — SIMILARITY GATE (bounded rewrite)

Chạy sau depth gate, trước mọi safety `--fix`:
```bash
python3 scripts/check_prompt_similarity.py --image "<stem>_image_prompts.txt" \
  [--video "<stem>_video_prompts.txt"]  # chỉ khi video_enabled
python3 scripts/check_prompt_similarity.py --music "<stem>_music_prompts.txt"  # chỉ khi music_enabled
```
Chỉ chạy lệnh optional khi medium đó được bật. Parse `rewrite_scene_ids` +
`banned_phrases`. Nếu exit 2, tối đa 2 lượt: xóa
đúng `scene-<ID>.md` hoặc `music-NNN.md` bị flag (giữ id thấp nhất mỗi cụm), chạy
lại expander/builder tương ứng với `banned_phrases` trong context, re-assemble,
rồi re-check. Trước lượt đầu, snapshot các artifact bị flag + violation count;
chỉ thay snapshot khi count giảm, và restore snapshot thấp nhất trước assemble
cuối. Không sửa final `.txt` bằng tay. Sau 2 lượt vẫn lỗi: HALT và liệt kê lỗi;
không nới threshold/gate để né.

Print: `Similarity gate: <clean | FAIL sau 2 rewrite>`.

**Content-safety gate (`--fix`):** sau khi assemble xong (file `.txt` đã là bản
cuối), chạy gate trên image và chỉ chạy trên video khi `video_enabled = true`.
Gate strip/soften brand/IP/likeness/gore/sexual + ép video animation-only.
Religion = WARN-only (không tự sửa).

```bash
python3 scripts/check_content_safety.py \
  --blocklist references/blocklist-content-safety.md \
  --output "<stem>_image_prompts.txt" --fix
# chỉ khi video_enabled = true:
python3 scripts/check_content_safety.py \
  --blocklist references/blocklist-content-safety.md \
  --output "<stem>_video_prompts.txt" --fix
```

Gate sửa trực tiếp `.txt` (giống anchor gate). KHÔNG tự tay sửa output để né gate.

### STEP 7.8 — VISUAL-HISTORY UPDATE

Chỉ khi có `series_name`, sau content-safety:
```bash
python3 scripts/check_prompt_similarity.py --extract-history \
  --image "<stem>_image_prompts.txt" [--music "<stem>_music_prompts.txt"] \
  --history ~/.gemini/bibles/<series_name>-visual-history.md
```
Chỉ truyền `--music` khi `music_enabled = true`. Không có series thì skip. Đây là
I/O thuần; file được dedupe và cap 150 dòng/section.

---

## STEP 8 — SELF-AUDIT (bắt buộc, trước khi báo hoàn tất)

Kiểm tra run đã đi ĐÚNG pipeline (chống tự-chế):

```bash
ls .work/scene-plan.md
python3 scripts/validate_artifacts.py --check scenes --work-dir .work --scene-plan .work/scene-plan.md
python3 scripts/validate_scene_plan.py --plan .work/scene-plan.md --chapters-json .work/chapters_qa.json
python3 scripts/check_run_legit.py --work .work \
  --image "<stem>_image_prompts.txt" [--video "<stem>_video_prompts.txt"] \
  --skill-dir "<skill_root>" \
  [--require-authorship --authorship-log .work/active-model-authorship.jsonl]
python3 scripts/check_prompt_similarity.py --image "<stem>_image_prompts.txt" \
  [--video "<stem>_video_prompts.txt"]  # chỉ khi video_enabled
python3 scripts/check_prompt_similarity.py --music "<stem>_music_prompts.txt"  # chỉ khi music_enabled
```

Xác nhận:
1. `.work/scene-plan.md` tồn tại. Nếu KHÔNG → run SAI (đã bỏ qua scene-planner):
   in cảnh báo `❌ AUDIT FAIL: thiếu scene-plan.md — pipeline đã bị bỏ qua` và CHẠY
   LẠI đúng từ STEP 5. KHÔNG báo hoàn tất.
2. Số file match strict regex `scene-\\d{3}[A-Za-z]?.md` = `images_n`. Không dùng glob thô
   `scene-*.md` vì sẽ bắt nhầm `scene-plan.md`. Nếu = 0 hoặc thiếu IDs → run SAI,
   chạy lại STEP 6 artifact gate.
3. validate_scene_plan: không còn grounding/schema/visual-repeat violation. Nếu
   còn → AUDIT FAIL, không báo hoàn tất.
4. File output cuối được sinh bởi `assemble_outputs.py` (STEP 7), KHÔNG phải tự tay
   ghi. Nếu bạn đã tự ghi file → xoá, chạy lại STEP 7.
5. `check_run_legit.py` exit 0. Exit 2 = dấu vân tay bypass (script tự chế trong
   `.work`, scene count lệch plan, boilerplate loop, optional block trùng lặp) →
   HALT, không sửa gate/allowlist, không sửa tay output để né.
   Trên Agy, hai flag authorship trong lệnh trên là bắt buộc; Codex/Claude omit
   vì không có Agy hook. Log cũ không tự bật chế độ này trên CLI khác.
6. Similarity gate exit 0 cho image và mọi medium đã bật. Không sửa
   gate/threshold để né; nếu chưa đạt → HALT.

Print: `Self-audit: <PASS | FAIL: lý do>`.

**Content-safety re-scan (KHÔNG `--fix`):** chạy lại gate trên file cuối để xác
nhận sạch (hoặc chỉ còn WARN religion). Exit 0 → PASS; blocking exit 2 → HALT;
chỉ residual religion WARN mới được báo trong summary.

```bash
python3 scripts/check_content_safety.py \
  --blocklist references/blocklist-content-safety.md \
  --output "<stem>_image_prompts.txt"
# và "<stem>_video_prompts.txt" nếu `video_enabled = true`.
```

Print: `Content-safety: <PASS | WARN: <residual>>`.

