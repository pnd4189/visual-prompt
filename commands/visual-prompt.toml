## WORKER SUBMODE (Pass-2 only, batch-runner-invoked)

Nếu args có `--worker-manifest <path>`, đây là **worker submode**: một isolated
Pass-2 scene-expansion worker do batch runner (`scripts/run-folder.sh`) spawn ở
runner level. Direct user invocation KHÔNG BAO GIỜ dùng submode này; parent-only
generation cho lệnh trực tiếp giữ nguyên.

Worker manifest là JSON bất biến do coordinator ghi TRƯỚC khi spawn; worker không
được sửa nó. Schema (đúng đủ, deterministic script `scripts/worker_manifest.py`
validate — model không tự validate hash bằng mắt):

```
{
  "schema": 1,
  "worker_id": "w1",
  "scene_ids": ["041", "042", "..."],
  "qa_hash": "<sha256 hex>",
  "bible_hash": "<sha256 hex>",
  "style_hash": "<sha256 hex>",
  "plan_hash": "<sha256 hex>",
  "history_hash": "<sha256 hex | empty string nếu chưa có history>",
  "snapshot_dir": "<read-only frozen bundle: chapters_qa.json, character-bible.md, active-style.md, scene-plan.md, visual-history snapshot>",
  "work_dir": "<worker-private workdir — nơi DUY NHẤT worker được ghi>",
  "video_enabled": false
}
```

Worker contract (fail-closed):

1. Việc đầu tiên: chạy
   `python3 scripts/worker_manifest.py --validate <manifest>`. Exit khác 0 (schema
   sai, hash stale so với frozen bundle, scene_id sai dạng) → kết thúc bằng
   `BATCH_RUN_HALTED:<batch_token>`, KHÔNG sinh gì thêm.
2. Bỏ qua STEP 1–5 (load/continuity/QA/bible/genre/style/scene count/scene plan):
   mọi input đã đóng băng trong `snapshot_dir`. Đọc scene-plan, chapters_qa.json,
   bible, style, visual-history snapshot từ `snapshot_dir` (read-only).
3. Chạy đúng STEP 6 (Pass 2) CHỈ cho các scene_id trong manifest, giữ nguyên
   parent-only micro-batch ≤3, cache-key công thức, source-anchor grounding.
   RULE 0 giữ nguyên TRONG worker: chính worker model tự viết từng
   `scene-NNN.md`; không spawn/delegate thêm tầng nào nữa. Ủy quyền chỉ tồn tại
   ở runner level (runner spawn worker sessions), không phải bên trong worker.
4. Ghi file CHỈ vào `work_dir`: đúng các `.work`-style `scene-<NNN>.md` có trong
   `scene_ids`. KHÔNG ghi bất kỳ file nào khác (không scratch, không script,
   không copy snapshot vào work_dir).
5. Sau Pass-2: chạy artifact gate
   `python3 scripts/validate_artifacts.py --check scenes --work-dir <work_dir> --scene-plan <snapshot_dir>/scene-plan.md`
   rồi `python3 scripts/worker_manifest.py --verify-run <manifest>` (ownership
   fence: work_dir chứa đúng và đủ scene files được giao, không runtime code).
6. DỪNG ngay sau scene validation. KHÔNG chạy STEP 6.5 (music), STEP 7 (assemble/
   depth/similarity/history), STEP 8 (self-audit); KHÔNG ghi completion marker,
   KHÔNG publish visual-history, KHÔNG copy output đi đâu. Join + mọi gate cuối
   là việc của coordinator.
7. Hoàn tất → kết thúc bằng đúng một dòng `BATCH_RUN_COMPLETE:<batch_token>`.
   Lỗi thật (anchor không khớp, gate FAIL, thiếu file) → `BATCH_RUN_HALTED:<batch_token>`.

